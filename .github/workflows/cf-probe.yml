name: cf-probe
on:
  workflow_dispatch:
  # Fires at 00:07 UTC, just after the 10k-neuron daily allocation resets.
  schedule:
    - cron: '7 0 * * *'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Probe Workers AI streaming
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          RUNS: "10"
          MAX_TOKENS: "2048"
        run: node .github/scripts/cf-stream-probe.mjs